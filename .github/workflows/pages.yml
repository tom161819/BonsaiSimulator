# Sestaví hru a nasadí ji na GitHub Pages při každém pushi do main (nebo ručně z karty Actions).
# Jednorázově: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Online funkce (účty, sbírka v cloudu, výstava) používají projekt Supabase z online.config.json (společný
# s aplikací Bonsai deník). Jiný projekt jde nastavit proměnnými v Settings → Secrets and variables → Actions →
# Variables: SUPABASE_URL a SUPABASE_ANON_KEY (jen veřejný klíč anon / publishable).
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
